
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akhtar Photography</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:25px 6%;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;font-weight:bold;letter-spacing:3px}
main{max-width:1400px;margin:auto;padding:35px 5%}
h1{font-size:clamp(42px,7vw,75px);margin:15px 0}
p{color:#aaa;line-height:1.6}
button{border:0;border-radius:25px;padding:11px 18px;background:#eee;color:#111;font-weight:bold;cursor:pointer}
button.secondary{background:#292929;color:white}
.hero{margin-bottom:30px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}
.filters button{background:#202024;color:#ddd}
.filters button.active{background:#eee;color:#111}
#gallery{columns:4 210px;column-gap:14px}
.photo{break-inside:avoid;background:#17171b;border-radius:10px;overflow:hidden;margin-bottom:14px}
.photo img{width:100%;display:block;cursor:zoom-in}
.caption{padding:12px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.caption small{color:#aaa}
#ownerPanel{display:none;background:#18181c;padding:20px;border-radius:12px;margin-bottom:25px}
input,select{background:#101014;color:white;border:1px solid #444;padding:12px;border-radius:8px;margin:5px;max-width:100%}
#status{color:#aaa;font-size:13px;margin-top:12px}
#loginPanel,#viewer{display:none;position:fixed;inset:0;background:#000d;z-index:10;place-items:center;padding:20px}
.loginbox{background:#19191e;padding:25px;border-radius:15px;width:min(380px,100%)}
.loginbox input{width:100%;margin:8px 0}
#viewer{z-index:20;cursor:zoom-out}
#viewer img{max-width:95vw;max-height:90vh;object-fit:contain}
footer{text-align:center;padding:30px;color:#777;border-top:1px solid #292929}
@media(max-width:700px){#gallery{columns:2 140px}header{padding:20px}}
</style>
</head>

<body>
<header>
  <div>
    <div class="brand">AKHTAR PHOTOGRAPHY</div>
    <small style="color:#888;letter-spacing:2px">STORIES THROUGH MY LENS</small>
  </div>
  <button class="secondary" id="loginBtn">Owner Login</button>
</header>

<main>
  <section class="hero">
    <h1>Moments.<br>In Frames.</h1>
    <p>Kumpulan foto, cerita, dan momen yang ingin aku abadikan.</p>
  </section>

  <section id="ownerPanel">
    <h3>Panel Pemilik</h3>
    <form id="uploadForm">
      <input id="photoFile" type="file" accept="image/*" required>
      <input id="photoTitle" placeholder="Judul foto" maxlength="80" required>
      <select id="photoCategory">
        <option>Nature</option>
        <option>Street</option>
        <option>Portrait</option>
        <option>Travel</option>
        <option>Other</option>
      </select>
      <button type="submit">Upload Foto</button>
      <button type="button" class="secondary" id="logoutBtn">Logout</button>
    </form>
    <div id="status"></div>
  </section>

  <nav class="filters" id="filters">
    <button class="active" data-cat="All">All</button>
    <button data-cat="Nature">Nature</button>
    <button data-cat="Street">Street</button>
    <button data-cat="Portrait">Portrait</button>
    <button data-cat="Travel">Travel</button>
    <button data-cat="Other">Other</button>
  </nav>

  <section id="gallery">Memuat galeri...</section>
</main>

<footer>© 2026 Akhtar Photography</footer>

<div id="loginPanel">
  <div class="loginbox">
    <h2>Owner Login</h2>
    <p>Login khusus pemilik website.</p>
    <form id="loginForm">
      <input type="email" value="akhtar32132123@gmail.com" readonly>
      <input id="password" type="password" placeholder="Password Supabase" required>
      <button type="submit" style="width:100%">Login</button>
      <button type="button" class="secondary" id="closeLogin" style="width:100%;margin-top:8px">Batal</button>
    </form>
    <p id="loginStatus"></p>
  </div>
</div>

<div id="viewer">
  <img id="viewerImg" alt="Foto">
</div>

<script>
// KONEKSI SUPABASE
const SUPABASE_URL = "https://evipwzjdyelahsemvqjv.supabase.co";
const SUPABASE_KEY = "sb_publishable_O4sRwFbo8YsbYokaH_QeEw_aGzhM3D1";

const OWNER_EMAIL = "akhtar32132123@gmail.com";
const BUCKET = "akhtar-photos";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let isOwner = false;
let currentCategory = "All";

const gallery = document.getElementById("gallery");
const statusEl = document.getElementById("status");

function setStatus(message){
  statusEl.textContent = message;
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

// MEMUAT FOTO
async function loadPhotos(){
  gallery.innerHTML = "<p>Memuat foto...</p>";

  let query = db.from("photos")
    .select("*")
    .order("created_at", {ascending:false});

  if(currentCategory !== "All"){
    query = query.eq("category", currentCategory);
  }

  const {data,error} = await query;

  if(error){
    gallery.innerHTML = "<p>Galeri gagal dimuat. Periksa konfigurasi Supabase.</p>";
    console.error(error);
    return;
  }

  gallery.innerHTML = "";

  if(!data || data.length === 0){
    gallery.innerHTML = "<p>Belum ada foto di kategori ini.</p>";
    return;
  }

  data.forEach(photo => {
    const url = photo.image_url ||
      db.storage.from(BUCKET).getPublicUrl(photo.image_path).data.publicUrl;

    const card = document.createElement("article");
    card.className = "photo";

    card.innerHTML = `
      <img loading="lazy"
        src="${escapeHTML(url)}"
        alt="${escapeHTML(photo.title)}">
      <div class="caption">
        <span>${escapeHTML(photo.title)}</span>
        <small>${escapeHTML(photo.category)}</small>
      </div>
    `;

    card.querySelector("img").onclick = () => {
      document.getElementById("viewerImg").src = url;
      document.getElementById("viewer").style.display = "grid";
    };

    if(isOwner){
      const del = document.createElement("button");
      del.textContent = "Hapus Foto";
      del.className = "secondary";
      del.style.margin = "0 10px 10px";
      del.onclick = () => deletePhoto(photo);
      card.appendChild(del);
    }

    gallery.appendChild(card);
  });
}

// UPLOAD FOTO
document.getElementById("uploadForm").onsubmit = async function(e){
  e.preventDefault();

  if(!isOwner) return;

  const file = document.getElementById("photoFile").files[0];
  const title = document.getElementById("photoTitle").value.trim();
  const category = document.getElementById("photoCategory").value;

  if(!file || !file.type.startsWith("image/")){
    setStatus("Pilih file gambar yang valid.");
    return;
  }

  const extension = (file.name.split(".").pop() || "jpg")
    .toLowerCase().replace(/[^a-z0-9]/g,"");

  const path = Date.now() + "-" +
    crypto.randomUUID() + "." + extension;

  setStatus("Sedang mengupload foto...");

  const {error:uploadError} = await db.storage
    .from(BUCKET)
    .upload(path,file,{contentType:file.type});

  if(uploadError){
    setStatus("Upload gagal: " + uploadError.message);
    return;
  }

  const publicUrl = db.storage.from(BUCKET)
    .getPublicUrl(path).data.publicUrl;

  const {error:insertError} = await db.from("photos").insert({
    title:title,
    category:category,
    image_path:path,
    image_url:publicUrl
  });

  if(insertError){
    await db.storage.from(BUCKET).remove([path]);
    setStatus("Gagal menyimpan foto: " + insertError.message);
    return;
  }

  this.reset();
  setStatus("Foto berhasil diupload!");
  loadPhotos();
};

// HAPUS FOTO
async function deletePhoto(photo){
  if(!confirm("Yakin ingin menghapus foto ini?")) return;

  const {error} = await db.from("photos")
    .delete().eq("id",photo.id);

  if(error){
    alert("Gagal menghapus: " + error.message);
    return;
  }

  if(photo.image_path){
    const result = await db.storage.from(BUCKET)
      .remove([photo.image_path]);

    if(result.error) console.error(result.error);
  }

  loadPhotos();
}

// LOGIN PEMILIK
document.getElementById("loginBtn").onclick = () => {
  document.getElementById("loginPanel").style.display = "grid";
};

document.getElementById("closeLogin").onclick = () => {
  document.getElementById("loginPanel").style.display = "none";
};

document.getElementById("loginForm").onsubmit = async function(e){
  e.preventDefault();

  const msg = document.getElementById("loginStatus");
  msg.textContent = "Memeriksa akun...";

  const {data,error} = await db.auth.signInWithPassword({
    email:OWNER_EMAIL,
    password:document.getElementById("password").value
  });

  if(error){
    msg.textContent = "Login gagal: " + error.message;
    return;
  }

  if(data.user.email.toLowerCase() !== OWNER_EMAIL){
    await db.auth.signOut();
    msg.textContent = "Akun bukan pemilik.";
    return;
  }

  document.getElementById("loginPanel").style.display = "none";
  document.getElementById("password").value = "";
  updateOwner(true);
};

document.getElementById("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  updateOwner(false);
};

function updateOwner(value){
  isOwner = value;
  document.getElementById("ownerPanel").style.display =
    value ? "block" : "none";
  document.getElementById("loginBtn").style.display =
    value ? "none" : "inline-block";

  setStatus(value ? "Login sebagai pemilik. Kamu bisa mengelola foto." : "");
  loadPhotos();
}

// FILTER KATEGORI
document.querySelectorAll("#filters button").forEach(button => {
  button.onclick = () => {
    document.querySelectorAll("#filters button")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
    currentCategory = button.dataset.cat;
    loadPhotos();
  };
});

// PERBESAR FOTO
document.getElementById("viewer").onclick = () => {
  document.getElementById("viewer").style.display = "none";
};

// CEK SESSION
db.auth.getSession().then(({data}) => {
  const user = data.session?.user;
  updateOwner(
    !!user && user.email?.toLowerCase() === OWNER_EMAIL
  );
});
</script>
</body>
</html>
